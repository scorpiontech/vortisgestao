server {
    listen 80;
    listen [::]:80;
    server_name app.vortisgestao.com.br www.app.vortisgestao.com.br;

    # ACME challenge do Let's Encrypt (Certbot --webroot ou --nginx)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }

    root /var/www/vortis;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache de assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Servidor default para qualquer outro Host (ex.: acesso direto pelo IP) — também
# atende o ACME, útil quando o Certbot valida antes do DNS estar 100% propagado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }

    root /var/www/vortis;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

